name: Download Media

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL"
        required: true
        default: "https://www.youtube.com/shorts/SzH3hhsLRu0"
      format_type:
        description: "Format (mp4 / mp3)"
        required: true
        default: "mp4"

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Deno
        uses: denoland/setup-deno@v2

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Write cookies from secret
        env:
          YT_COOKIES_DATA: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES_DATA" ]; then
            printf '%s\n' "$YT_COOKIES_DATA" > cookies.txt
          fi

      - name: Download and convert
        env:
          VIDEO_URL: ${{ inputs.url }}
          FORMAT_TYPE: ${{ inputs.format_type }}
        run: |
          mkdir -p downloads
          COOKIE_ARG=""
          if [ -f cookies.txt ]; then
            COOKIE_ARG="--cookies cookies.txt"
          fi

          if [ "$FORMAT_TYPE" = "mp3" ]; then
            yt-dlp --js-runtimes deno --remote-components ejs:github $COOKIE_ARG \
              -x --audio-format mp3 -P downloads "$VIDEO_URL"
          else
            yt-dlp --js-runtimes deno --remote-components ejs:github $COOKIE_ARG \
              -f "bv*+ba/b" --merge-output-format mp4 -P downloads "$VIDEO_URL"
          fi

      - name: Upload downloaded file
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-media
          path: downloads/*
